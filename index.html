<!DOCTYPE html>

<!-- 
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-light" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        
    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Plantmotion</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->
    
    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="We love plants - our passion for them grows every day 💚">
    
    <!-- Keywords -->
    <meta name="keywords" content="plantmotion, plants, nursery, plantshop, platycerium, alocasia, monstera, syngonium, variegata">
    
    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://plantmotion.de">
    
    <!-- Author Information -->
    <meta name="author" content="Christian Ludwig">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

  </head>

<body>

    <div class="container">
        <div class="column">

            <!-- 
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--none" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Plantmotion">

            <!-- Replace with your name or brand -->
            <h1>
              <div>Plantmotion</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>We love plants - our passion for them grows every day 💚</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/plantmotion.de/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- eBay -->
              <a class="button button-ebay" href="https://www.ebay.de/usr/plantmotion_de" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/ebay.svg" alt="eBay Icon">Shop on eBay</a>

              <!-- kleinanzeigen -->
              <a class="button button-kleinanzeigen" href="https://www.kleinanzeigen.de/s-bestandsliste.html?userId=10625912" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/kleinanzeigen.svg" alt="kleinanzeigen Icon">kleinanzeigen</a>

              <!-- Printables -->
              <a class="button button-printables" href="https://www.printables.com/@plantmotiond_2908707" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/printables.svg" alt="Printables icon">Printables</a>

              <!-- Generic Email -->
              <a class="button button-default" href="mailto:info@plantmotion.de" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon">Email Us</a>

      </div>
        
      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>
    
    </div>
  </div>

</body>

</html>
